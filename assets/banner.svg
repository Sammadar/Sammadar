<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sammadar dos Santos — engenharia de software">
  <rect width="1200" height="300" fill="#22183a"/>
  <!-- malha de pontos (cobertura) no canto direito -->
  <g fill="#a492c4" opacity=".28">
    <g id="r">
      <circle cx="760" cy="40" r="2.2"/><circle cx="800" cy="40" r="2.2"/><circle cx="840" cy="40" r="2.2"/><circle cx="880" cy="40" r="2.2"/><circle cx="920" cy="40" r="2.2"/><circle cx="960" cy="40" r="2.2"/><circle cx="1000" cy="40" r="2.2"/><circle cx="1040" cy="40" r="2.2"/><circle cx="1080" cy="40" r="2.2"/><circle cx="1120" cy="40" r="2.2"/><circle cx="1160" cy="40" r="2.2"/>
    </g>
    <use href="#r" y="40"/><use href="#r" y="80"/><use href="#r" y="120"/><use href="#r" y="160"/><use href="#r" y="200"/><use href="#r" y="240"/>
  </g>
  <!-- três células de cobertura, só o contorno -->
  <g fill="none" stroke="#c4a0ff" stroke-width="2">
    <circle cx="960" cy="150" r="78" opacity=".9"/>
    <circle cx="1060" cy="110" r="52" opacity=".55"/>
    <circle cx="1040" cy="215" r="40" opacity=".4"/>
  </g>
  <g fill="#c4a0ff">
    <circle cx="960" cy="150" r="5"/><circle cx="1060" cy="110" r="4"/><circle cx="1040" cy="215" r="3.5"/>
  </g>
  <!-- nome e linha -->
  <text x="72" y="128" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#f0eafa" letter-spacing="-1.5">Sammadar dos Santos</text>
  <text x="74" y="168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#a492c4">engenharia de software · sistemas de gestão para telecom</text>
  <!-- régua de marcos -->
  <g transform="translate(74,222)">
    <line x1="0" y1="0" x2="540" y2="0" stroke="#a492c4" stroke-opacity=".45" stroke-width="2"/>
    <g fill="#c4a0ff"><circle cx="0" cy="0" r="6"/><circle cx="90" cy="0" r="6"/><circle cx="180" cy="0" r="6"/><circle cx="270" cy="0" r="6"/></g>
    <g fill="#22183a" stroke="#c4a0ff" stroke-width="2"><circle cx="360" cy="0" r="6"/><circle cx="450" cy="0" r="6"/><circle cx="540" cy="0" r="6"/></g>
    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#a492c4">
      <text x="0" y="24">planejar</text><text x="90" y="24">contratar</text><text x="180" y="24">construir</text><text x="270" y="24">instalar</text><text x="360" y="24">integrar</text><text x="450" y="24">testar</text><text x="540" y="24" text-anchor="end">no ar</text>
    </g>
  </g>
</svg>
